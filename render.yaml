# One-click deploy of the KernelLens backend on Render.
# Render dashboard -> New -> Blueprint -> pick this repo.
#
# The database is NOT created here (Render allows only one free Postgres per
# account). Create a free Postgres on Neon (neon.tech) and paste its connection
# string as DATABASE_URL. Plain postgres:// / postgresql:// URLs with
# ?sslmode=require are converted for asyncpg automatically.
#
# You will be asked for: DATABASE_URL, GEMINI_API_KEY, CORS_ORIGINS (your Vercel URL).
services:
  - type: web
    name: kernellens-api
    runtime: docker
    region: ohio  # same AWS region as the Neon database (us-east-2)
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ANALYZE_RATE_LIMIT_PER_MIN
        value: "6"
