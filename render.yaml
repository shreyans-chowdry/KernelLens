# One-click deploy of the KernelLens backend + Postgres on Render.
# Render dashboard -> New -> Blueprint -> pick this repo.
# You will be asked for GEMINI_API_KEY and CORS_ORIGINS (your Vercel URL).
services:
  - type: web
    name: kernellens-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kernellens-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ANALYZE_RATE_LIMIT_PER_MIN
        value: "6"

databases:
  - name: kernellens-db
    plan: free
    databaseName: kernellens
